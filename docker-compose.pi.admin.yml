services:
  scout-phase4-admin:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.pi.admin
    image: scout-fusion/pi-phase4-admin:preview
    container_name: scout-pi-phase4-admin
    restart: unless-stopped
    env_file:
      - /data/scout/secrets/live-runtime.env
    environment:
      SCOUT_DATA_ROOT: /data/scout
      SCOUT_RUNTIME_PROFILE: pi-phase4-admin-preview
      SCOUT_SAFETY_ENABLED: "false"
      SCOUT_SAFETY_INCIDENT_STORE: /data/scout/incidents
      SCOUT_PRETRIP_WORKSPACE_ROOT: /data/scout/admin/pretrip-workspaces
      SCOUT_ADMIN_OSM_TILE_CACHE_ROOT: /data/scout/osm-tiles
      SCOUT_ADMIN_RASTER_TILE_CACHE_ROOT: /data/scout/raster-tiles
      SCOUT_ADMIN_OSM_TILE_FALLBACK: "true"
      SCOUT_ADMIN_RASTER_TILE_FALLBACK: "true"
      SCOUT_ADMIN_AUTH_REQUIRED: "${SCOUT_ADMIN_AUTH_REQUIRED:-true}"
      SCOUT_ADMIN_BASIC_USERNAME: "${SCOUT_ADMIN_BASIC_USERNAME:-scout-admin}"
      SCOUT_ADMIN_ACCESS_TOKEN_FILE: /data/scout/admin/secrets/phase4-admin-token
      SCOUT_INGRESS_OBSERVER_SUPERVISOR_ENABLED: "${SCOUT_INGRESS_OBSERVER_SUPERVISOR_ENABLED:-true}"
      SCOUT_SENSORLOGGER_MQTT_AUTOSTART: "${SCOUT_SENSORLOGGER_MQTT_AUTOSTART:-true}"
      SCOUT_SENSORLOGGER_MQTT_ENV_FILE: "${SCOUT_SENSORLOGGER_MQTT_ENV_FILE:-/data/scout/secrets/sensorlogger-mqtt.env}"
      SCOUT_SENSORLOGGER_MQTT_EVIDENCE_DIR: "${SCOUT_SENSORLOGGER_MQTT_EVIDENCE_DIR:-/data/scout/admin/ingress/sensorlogger_mqtt}"
      SCOUT_SENSORLOGGER_MQTT_LOG_PATH: "${SCOUT_SENSORLOGGER_MQTT_LOG_PATH:-/data/scout/admin/ingress/sensorlogger-mqtt-observer.log}"
      SCOUT_SX1303_GATEWAY_AUTOSTART: "${SCOUT_SX1303_GATEWAY_AUTOSTART:-true}"
      SCOUT_SX1303_GATEWAY_EVIDENCE_DIR: "${SCOUT_SX1303_GATEWAY_EVIDENCE_DIR:-/data/scout/admin/ingress/sx1303_gateway}"
      SCOUT_SX1303_GATEWAY_LOG_PATH: "${SCOUT_SX1303_GATEWAY_LOG_PATH:-/data/scout/admin/ingress/sx1303-gateway-observer.log}"
      SCOUT_SX1303_GATEWAY_HOST: "${SCOUT_SX1303_GATEWAY_HOST:-host.docker.internal}"
      SCOUT_SX1303_GATEWAY_TCP_PORTS: "${SCOUT_SX1303_GATEWAY_TCP_PORTS:-1883,3001,8080,8090}"
      SCOUT_SX1303_GATEWAY_UDP_PORTS: "${SCOUT_SX1303_GATEWAY_UDP_PORTS:-1700}"
      SCOUT_SX1303_GATEWAY_CONFIG_PATHS: "${SCOUT_SX1303_GATEWAY_CONFIG_PATHS:-/data/scout/lora/global_conf.json,/data/scout/lora/station.conf,/data/scout/lora/chirpstack-gateway-bridge.toml,/data/scout/lora/chirpstack.toml,/data/scout/chirpstack/chirpstack.toml,/data/scout/chirpstack/regions/as923_2.toml,/data/scout/chirpstack/regions/as923.toml,/data/scout/providers/lora/chirpstack-docker/configuration/chirpstack/chirpstack.toml,/data/scout/providers/lora/chirpstack-docker/configuration/chirpstack/region_as923_2.toml,/data/scout/providers/lora/chirpstack-docker/configuration/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-as923_2.toml}"
      SCOUT_SX1303_GATEWAY_EXPECTED_REGION_TOKENS: "${SCOUT_SX1303_GATEWAY_EXPECTED_REGION_TOKENS:-AS923,AS923_2,AS923_TW_920_925}"
      SCOUT_SX1303_GATEWAY_FORBIDDEN_REGION_TOKENS: "${SCOUT_SX1303_GATEWAY_FORBIDDEN_REGION_TOKENS:-EU868,US915,AU915,CN470,KR920,IN865,RU864}"
      SCOUT_SX1303_GATEWAY_UPLINK_JSONL: "${SCOUT_SX1303_GATEWAY_UPLINK_JSONL:-/data/scout/providers/lora/sx1303-gateway-uplink.jsonl}"
      SCOUT_SX1303_GATEWAY_GATEWAY_GPS_JSONL: "${SCOUT_SX1303_GATEWAY_GATEWAY_GPS_JSONL:-/data/scout/providers/lora/sx1303-gateway-gps-nmea-smoke.jsonl}"
      SCOUT_SX1303_GATEWAY_RF_PREFLIGHT_JSONL: "${SCOUT_SX1303_GATEWAY_RF_PREFLIGHT_JSONL:-/data/scout/providers/lora/sx1303-gateway-smoke.jsonl}"
      SCOUT_SX1303_GATEWAY_RX_READINESS_JSONL: "${SCOUT_SX1303_GATEWAY_RX_READINESS_JSONL:-/data/scout/providers/lora/sx1303-gateway-rx-readiness.jsonl}"
      SCOUT_SX1303_GATEWAY_OLED_STATUS: "${SCOUT_SX1303_GATEWAY_OLED_STATUS:-true}"
      SCOUT_SX1303_GATEWAY_OLED_DRIVER: "${SCOUT_SX1303_GATEWAY_OLED_DRIVER:-sh1107g}"
      SCOUT_SX1303_GATEWAY_LED_STATUS: "${SCOUT_SX1303_GATEWAY_LED_STATUS:-true}"
      SCOUT_SX1303_GATEWAY_LED_PORT: "${SCOUT_SX1303_GATEWAY_LED_PORT:-D5}"
      SCOUT_SX1303_GATEWAY_LED_OK_BIT: "${SCOUT_SX1303_GATEWAY_LED_OK_BIT:-8}"
      SCOUT_SX1303_GATEWAY_LED_WARN_BIT: "${SCOUT_SX1303_GATEWAY_LED_WARN_BIT:-1}"
      SCOUT_SX1303_GATEWAY_LED_FAIL_BIT: "${SCOUT_SX1303_GATEWAY_LED_FAIL_BIT:-10}"
      SCOUT_LORAWAN_CLIENT_AUTOSTART: "${SCOUT_LORAWAN_CLIENT_AUTOSTART:-true}"
      SCOUT_LORAWAN_CLIENT_EVIDENCE_DIR: "${SCOUT_LORAWAN_CLIENT_EVIDENCE_DIR:-/data/scout/admin/ingress/lorawan_client}"
      SCOUT_LORAWAN_CLIENT_LOG_PATH: "${SCOUT_LORAWAN_CLIENT_LOG_PATH:-/data/scout/admin/ingress/lorawan-client-observer.log}"
      SCOUT_LORAWAN_CLIENT_KEY_SYNC_JSONL: "${SCOUT_LORAWAN_CLIENT_KEY_SYNC_JSONL:-/data/scout/providers/lora/wio-e5-chirpstack-key-sync.jsonl}"
      SCOUT_LORAWAN_CLIENT_PROFILE_PROVISION_JSONL: "${SCOUT_LORAWAN_CLIENT_PROFILE_PROVISION_JSONL:-/data/scout/providers/lora/wio-e5-chirpstack-profile-provision.jsonl}"
      SCOUT_LORAWAN_CLIENT_TRIAL_PLAN_JSONL: "${SCOUT_LORAWAN_CLIENT_TRIAL_PLAN_JSONL:-/data/scout/providers/lora/wio-e5-uplink-trial-plan.jsonl}"
      SCOUT_LORAWAN_CLIENT_RF_TRIAL_JSONL: "${SCOUT_LORAWAN_CLIENT_RF_TRIAL_JSONL:-/data/scout/providers/lora/wio-e5-rf-trial.jsonl}"
      SCOUT_LORAWAN_CLIENT_JOIN_AUDIT_JSONL: "${SCOUT_LORAWAN_CLIENT_JOIN_AUDIT_JSONL:-/data/scout/providers/lora/wio-e5-chirpstack-join-audit.jsonl}"
      SCOUT_LORAWAN_CLIENT_JOIN_STATE_DIAGNOSTIC_JSONL: "${SCOUT_LORAWAN_CLIENT_JOIN_STATE_DIAGNOSTIC_JSONL:-/data/scout/providers/lora/wio-e5-chirpstack-join-state-diagnostic.jsonl}"
      SCOUT_LORAWAN_CLIENT_UPLINK_JSONL: "${SCOUT_LORAWAN_CLIENT_UPLINK_JSONL:-/data/scout/providers/lora/sx1303-gateway-uplink.jsonl}"
      SCOUT_LORAWAN_CLIENT_TAIL_STATUS_JSONL: "${SCOUT_LORAWAN_CLIENT_TAIL_STATUS_JSONL:-/data/scout/providers/lora/sx1303-gateway-uplink-tail-status.jsonl}"
      SCOUT_LORAWAN_CLIENT_WIO_AT_JSONL: "${SCOUT_LORAWAN_CLIENT_WIO_AT_JSONL:-/data/scout/providers/wio_e5/wio-e5-at-smoke.jsonl}"
      SCOUT_LORAWAN_CLIENT_OLED_STATUS: "${SCOUT_LORAWAN_CLIENT_OLED_STATUS:-true}"
      SCOUT_LORAWAN_CLIENT_OLED_DRIVER: "${SCOUT_LORAWAN_CLIENT_OLED_DRIVER:-sh1107g}"
      SCOUT_LORAWAN_CLIENT_LED_STATUS: "${SCOUT_LORAWAN_CLIENT_LED_STATUS:-true}"
      SCOUT_LORAWAN_CLIENT_LED_PORT: "${SCOUT_LORAWAN_CLIENT_LED_PORT:-D5}"
      SCOUT_LORAWAN_CLIENT_LED_OK_BIT: "${SCOUT_LORAWAN_CLIENT_LED_OK_BIT:-9}"
      SCOUT_LORAWAN_CLIENT_LED_WARN_BIT: "${SCOUT_LORAWAN_CLIENT_LED_WARN_BIT:-1}"
      SCOUT_LORAWAN_CLIENT_LED_FAIL_BIT: "${SCOUT_LORAWAN_CLIENT_LED_FAIL_BIT:-10}"
      SCOUT_DEBUG_API_ENABLED: "${SCOUT_DEBUG_API_ENABLED:-true}"
      SCOUT_DEBUG_LOG_PATH: "${SCOUT_DEBUG_LOG_PATH:-/data/scout/admin/debug/runtime-debug-events.jsonl}"
      SCOUT_CWA_API_KEY: "${SCOUT_CWA_API_KEY:-}"
      CWA_API_KEY: "${CWA_API_KEY:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      EARTHENGINE_TOKEN: "${EARTHENGINE_TOKEN:-}"
      SCOUT_AI_ASSISTANT_ENABLED: "1"
      SCOUT_AI_ASSISTANT_PROVIDER: pydantic_ai
      SCOUT_AI_ASSISTANT_CONFIG_PATH: /data/scout/config/assistant-models.json
      SCOUT_WEATHER_API_ENABLED: "${SCOUT_WEATHER_API_ENABLED:-false}"
      SCOUT_WEATHER_API_PROVIDER: open_meteo
      SCOUT_PORT: "9099"
      SCOUT_LOG_LEVEL: info
    ports:
      - "9110:9099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${SCOUT_DOCKER_I2C_GID:-988}"
      - "${SCOUT_DOCKER_GPIO_GID:-986}"
    devices:
      - "${SCOUT_DOCKER_I2C_DEVICE:-/dev/i2c-1}:/dev/i2c-1"
      - "${SCOUT_DOCKER_GPIOCHIP_DEVICE:-/dev/gpiochip0}:/dev/gpiochip0"
    volumes:
      - type: bind
        source: /data/scout
        target: /data/scout
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9099/health', timeout=3); raise SystemExit(0 if json.load(r).get('status') == 'ok' else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
