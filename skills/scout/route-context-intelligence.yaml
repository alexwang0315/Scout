id: route-context-intelligence
version: 0.1.2
status: experimental
type: analysis
priority: 54
triggers:
  - event: assistant.route_context_intelligence_requested
    description: Answer Route Context Intelligence questions from docs/specs/scout-route-context-intelligence-implementation.md about route story, historical/cultural/natural/terrain/seasonal layers, observation stops, source gaps, and briefing-ready route context.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.normalized.context.route_context
      - docs.specs.scout_route_context_intelligence_implementation
      - agents.skills.scout_route_context_briefing.source_catalog
  - event: assistant.route_context_briefing_html_requested
    description: Plan or draft a candidate-only route-context briefing response from workspace cache while preserving the Scout media quality gate and source-tier boundary.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.normalized.context.route_context.route_context_pack
      - pretrip.workspace.candidates.route_context_points
      - pretrip.workspace.normalized.context.route_context.source_manifest
  - event: assistant.route_context_research_gap_detected
    description: Identify missing P0/P1/P2 route-context evidence according to docs/specs/scout-route-context-intelligence-implementation.md and explain whether trusted native research, operator source review, or offline cache regeneration is needed.
    required_refs:
      - pretrip.workspace.project
      - docs.specs.scout_route_context_intelligence_implementation
activation_gate:
  mode: manual
  requires_human_approval: false
  conditions:
    - user asks why a route is worth walking, what historical/cultural/natural/terrain/seasonal context exists, which points are worth a short observation stop, or what a pretrip route briefing should include
    - follow docs/specs/scout-route-context-intelligence-implementation.md as the controlling Route Context Intelligence spec
    - mirror the Scout route-context briefing skill's P0/P1/P2 source catalog, product copy gate, media quality gate, and visual/map briefing template when forming answer plans
    - first answer from workspace cache and deterministic Scout AI tools before any remote research path
    - preserve the spec's P0/P1/P2 source tier policy, provenance fields, source gaps, cache-first answer path, and offline regeneration boundary
    - use P0 sources for official/status/baseline facts, P1 sources for context expansion/community names/repeated point references, and P2 Scout-owned evidence for Scout-local completed-trip observations with path/hash/capture/privacy/review provenance
    - unreviewed P2 evidence can seed candidates or caveats only; reviewed P2 may support route notes, observation points, pace-fit context, and next-trip pretrip suggestions
    - if workspace evidence is missing, report P0/P1/P2 source gaps and whether trusted native WebSearch/WebFetch could collect candidate evidence when enabled by operator policy
    - route-context HTML or presentation requests may be drafted only from cached route_context_pack, route_context_points, source_manifest, media_manifest, and route-specific media refs
    - product-visible wording must describe the trip, itinerary, route segment, source, lodging/intermediate point, terrain, weather/season, observation stop, or leader review task; do not expose prompt/model/cache/artifact-boundary implementation wording
    - do not reuse previous route URLs, image choices, lodging points, or copy as route defaults; previous artifacts are structure examples only
    - reject website chrome, logos, SVG icons, tracking pixels, social widgets, and decorative placeholder images; missing visual slots become explicit visual evidence gaps
    - briefing-style answers should prefer visual agenda, photo essay, map atlas, source tier spine, six context layers, P2 Scout-owned layer, and leader review tasks over source-table or engineering-report prose
    - output remains candidate-only and never grants on-route stopping, photographing, waiting, detouring, or go/no-go permission
    - distinguish worth observing from allowed to stop; any stopping, photographing, waiting, detouring, or route decision still needs Contextual Permissioning
    - no runtime safety mutation, outbound send, hardware control, or workspace write is allowed from this read-only skill
noise_control:
  cooldown_seconds: 0
  dedupe_window_seconds: 0
  max_runs_per_mission: null
  suppression_keys:
    - project_id
    - route_context_question_family
preflight:
  required_skill_ids:
    - route-reference-point-lookup
  required_capabilities:
    - scout.ai.route_context.assess.v0
    - pydantic_ai.tool.assess_scout_route_context.v0
    - pydantic_ai.tool.search_scout_workspace_catalog.v0
    - pydantic_ai.tool.search_scout_route_structure.v0
    - pydantic_ai.tool.search_scout_major_points.v0
    - pydantic_ai.tool.search_scout_map_perception.v0
    - pydantic_ai.tool.search_scout_evidence_fulltext.v0
    - scout.ai.context_registry.describe
    - scout.ai.tool_registry.describe
  required_artifacts:
    - pretrip.workspace.project
    - docs.specs.scout_route_context_intelligence_implementation
    - pretrip.workspace.normalized.context.route_context.route_context_pack
    - pretrip.workspace.candidates.route_context_points
    - pretrip.workspace.normalized.context.route_context.source_manifest
    - agents.skills.scout_route_context_briefing.source_catalog
allowed_reads:
  - docs.specs.scout_route_context_intelligence_implementation
  - agents.skills.scout_route_context_briefing.source_catalog
  - pretrip.workspace.project
  - pretrip.workspace.route_summary
  - pretrip.workspace.normalized.context.route_context
  - pretrip.workspace.normalized.context.route_context.route_context_pack
  - pretrip.workspace.normalized.context.route_context.route_context_evidence
  - pretrip.workspace.normalized.context.route_context.source_manifest
  - pretrip.workspace.normalized.context.route_context.media_manifest
  - pretrip.workspace.normalized.context.route_context.crawl_seed_plan
  - pretrip.workspace.candidates.route_context_points
  - pretrip.workspace.candidates.route_mileage_k_anchors
  - pretrip.workspace.scout_owned.completed_trip_gpx
  - pretrip.workspace.scout_owned.deviation_records
  - pretrip.workspace.scout_owned.dwell_records
  - pretrip.workspace.scout_owned.photo_points
  - pretrip.workspace.scout_owned.voice_notes
  - pretrip.workspace.scout_owned.motion_evidence
  - pretrip.workspace.scout_owned.barometric_altitude
  - pretrip.workspace.scout_owned.team_spacing
  - pretrip.workspace.scout_owned.stop_worthiness_feedback
  - pretrip.workspace.scout_owned.action_log
  - pretrip.workspace.outputs.briefings.route_context_briefing
  - pretrip.workspace.outputs.layers.normalized.web_case_evidence
  - pretrip.workspace.outputs.layers.normalized.raster_label_evidence
  - pretrip.workspace.outputs.mcp
  - pretrip.workspace.outputs.mcp.named_point_evidence
  - pretrip.workspace.outputs.map_perception
  - pretrip.workspace.candidates.route_note_candidates
  - pretrip.workspace.evidence_fulltext
allowed_writes: []
forbidden_writes:
  - pretrip.workspace
  - phase1.runtime
  - phase1.safety
  - phase2.brain.observed_facts
  - live.safety_api
  - hardware.controls
  - transport.egress
output_schema:
  format: artifact
  node_types:
    - RouteContextIntelligenceAnswer
    - RouteContextResearchGap
    - SkillRunRecord
  artifact_kinds:
    - scout_ai_route_context_intelligence_answer
    - scout_ai_route_context_research_gap
    - scout_ai_route_context_tool_output
  required_fields:
    - answerability
    - route_context_summary
    - context_layers
    - observation_points
    - contextual_permission_boundary
    - source_tier_summary
    - source_refs
    - cache_status
    - missing_evidence
    - research_gap_next_step
    - p2_scout_owned_evidence_summary
    - p2_privacy_review_state
    - product_copy_gate
    - visual_evidence_gaps
    - offline_regeneration_boundary
    - candidate_only
    - runtime_safety_truth
  layout_contract:
    required_sections:
      - question_intent
      - visual_agenda
      - photo_essay
      - visual_kit
      - map_atlas
      - source_tier_spine
      - route_context_summary
      - historical_layer
      - cultural_layer
      - natural_layer
      - terrain_layer
      - seasonal_layer
      - observation_points
      - p2_scout_owned_layer
      - source_tier_summary
      - missing_evidence
      - leader_review_tasks
      - contextual_permission_boundary
      - safety_boundary
    source_tiers_required:
      - P0
      - P1
      - P2
    visual_direction:
      palette: bold_expedition_route_context
      accents:
        - dark_ground
        - ember_red
        - signal_yellow
        - high_contrast_map_panel
      rule: Use a high-energy expedition briefing structure with route-specific photos, maps, source cards, and review tasks; never fall back to a pure source table or implementation report.
    media_quality_gate:
      must_prefer:
        - route-specific P0/P1 photos or maps bound to the route, lodging nodes, named points, context layers, or source sections
        - reviewed P2 Scout-owned photos, voice notes, stop-worthiness feedback, and route media from the same workspace
        - map or route-summary visuals that are explicitly tied to Scout route context evidence
        - full-route overview maps, lodging/intermediate nodes, terrain passage visuals, short observation point media, and weather/season imagery when provenance is clear
      must_reject:
        - website logos, logotypes, badges, avatars, and brand tiles
        - SVG icons and UI controls such as menu, search, close, language, share, audio, or browser chrome buttons
        - tracking pixels, social widgets, and unrelated campaign or education graphics
        - decorative placeholders used to fill missing briefing slots
        - product-visible prompt/model/compiler/cache/path/boundary wording, material-board labels, image-guide labels, and internal AI/design guidance
      missing_visual_policy: Report visual evidence gaps and route-specific shot-list or leader-review items instead of substituting generic graphics, site chrome, or explaining the page template.
      post_render_check: Route-context briefing output should have no selected hero/gallery images from logos, UI chrome, tracking media, or unrelated brand assets.
    safety_boundary:
      candidate_only: true
      runtime_safety_truth: false
failure_policy:
  on_error: record_failure
  retry:
    max_attempts: 0
    backoff_seconds: 0
  degrade_to: scout.ai.route_context.assess.v0
control_surface:
  operator_visible: true
  manual_run_allowed: true
  disable_allowed: true
  status_label: Route context intelligence
audit:
  log_inputs: true
  log_outputs: true
  log_decision: true
  retention: mission_lifetime
application_routing:
  enabled: true
  route_id: scout.route_context_intelligence
  route_target: scout.ai.route_context.assess.v0
  routing_agent: scout.skill_routing_agent.v0
  observation_names:
    - route_context_question
    - route_briefing_question
    - route_observation_stop_question
    - route_source_gap_question
    - route_visual_gap_question
    - route_context_product_copy_question
    - p2_scout_owned_route_context_question
  capability_tags:
    - route_context
    - route_briefing
    - historical_context
    - cultural_context
    - natural_context
    - terrain_context
    - seasonal_context
    - observation_points
    - source_tier_spine
    - p2_scout_owned_evidence
    - media_quality_gate
    - product_copy_gate
    - offline_regeneration
  profile: pretrip_read_only
  side_effect_policy: no_runtime_safety_mutation_no_outbound
  allowed_outbound_envelope_classes: []
  fan_out: false
