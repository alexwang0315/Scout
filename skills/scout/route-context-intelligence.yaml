id: route-context-intelligence
version: 0.1.0
status: experimental
type: analysis
priority: 54
triggers:
  - event: assistant.route_context_intelligence_requested
    description: Answer Route Context Intelligence questions from docs/specs/scout-route-context-intelligence-implementation.md about route story, historical/cultural/natural/terrain/seasonal layers, observation stops, source gaps, and briefing-ready route context.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.normalized.context.route_context
      - docs.specs.scout_route_context_intelligence_implementation
  - event: assistant.route_context_research_gap_detected
    description: Identify missing P0/P1/P2 route-context evidence according to docs/specs/scout-route-context-intelligence-implementation.md and explain whether trusted native research, operator source review, or offline cache regeneration is needed.
    required_refs:
      - pretrip.workspace.project
      - docs.specs.scout_route_context_intelligence_implementation
activation_gate:
  mode: manual
  requires_human_approval: false
  conditions:
    - user asks why a route is worth walking, what historical/cultural/natural/terrain/seasonal context exists, which points are worth a short observation stop, or what a pretrip route briefing should include
    - follow docs/specs/scout-route-context-intelligence-implementation.md as the controlling Route Context Intelligence spec
    - first answer from workspace cache and deterministic Scout AI tools before any remote research path
    - preserve the spec's P0/P1/P2 source tier policy, provenance fields, source gaps, cache-first answer path, and offline regeneration boundary
    - if workspace evidence is missing, report P0/P1/P2 source gaps and whether trusted native WebSearch/WebFetch could collect candidate evidence when enabled by operator policy
    - output remains candidate-only and never grants on-route stopping, photographing, waiting, detouring, or go/no-go permission
    - no runtime safety mutation, outbound send, hardware control, or workspace write is allowed from this read-only skill
noise_control:
  cooldown_seconds: 0
  dedupe_window_seconds: 0
  max_runs_per_mission: null
  suppression_keys:
    - project_id
    - route_context_question_family
preflight:
  required_skill_ids:
    - route-reference-point-lookup
  required_capabilities:
    - scout.ai.route_context.assess.v0
    - pydantic_ai.tool.assess_scout_route_context.v0
    - pydantic_ai.tool.search_scout_route_structure.v0
    - pydantic_ai.tool.search_scout_map_perception.v0
    - pydantic_ai.tool.search_scout_evidence_fulltext.v0
    - scout.ai.context_registry.describe
    - scout.ai.tool_registry.describe
  required_artifacts:
    - pretrip.workspace.project
    - docs.specs.scout_route_context_intelligence_implementation
allowed_reads:
  - docs.specs.scout_route_context_intelligence_implementation
  - pretrip.workspace.project
  - pretrip.workspace.route_summary
  - pretrip.workspace.normalized.context.route_context
  - pretrip.workspace.normalized.context.route_context.route_context_pack
  - pretrip.workspace.normalized.context.route_context.route_context_evidence
  - pretrip.workspace.normalized.context.route_context.source_manifest
  - pretrip.workspace.normalized.context.route_context.media_manifest
  - pretrip.workspace.normalized.context.route_context.crawl_seed_plan
  - pretrip.workspace.candidates.route_context_points
  - pretrip.workspace.candidates.route_mileage_k_anchors
  - pretrip.workspace.outputs.briefings.route_context_briefing
  - pretrip.workspace.outputs.layers.normalized.web_case_evidence
  - pretrip.workspace.outputs.layers.normalized.raster_label_evidence
  - pretrip.workspace.outputs.mcp
  - pretrip.workspace.outputs.mcp.named_point_evidence
  - pretrip.workspace.outputs.map_perception
  - pretrip.workspace.candidates.route_note_candidates
  - pretrip.workspace.evidence_fulltext
allowed_writes: []
forbidden_writes:
  - pretrip.workspace
  - phase1.runtime
  - phase1.safety
  - phase2.brain.observed_facts
  - live.safety_api
  - hardware.controls
  - transport.egress
output_schema:
  format: artifact
  node_types:
    - RouteContextIntelligenceAnswer
    - RouteContextResearchGap
    - SkillRunRecord
  artifact_kinds:
    - scout_ai_route_context_intelligence_answer
    - scout_ai_route_context_research_gap
    - scout_ai_route_context_tool_output
  required_fields:
    - answerability
    - route_context_summary
    - context_layers
    - observation_points
    - source_tier_summary
    - source_refs
    - missing_evidence
    - research_gap_next_step
    - candidate_only
    - runtime_safety_truth
  layout_contract:
    required_sections:
      - question_intent
      - route_context_summary
      - historical_layer
      - cultural_layer
      - natural_layer
      - terrain_layer
      - seasonal_layer
      - observation_points
      - source_tier_summary
      - missing_evidence
      - safety_boundary
    source_tiers_required:
      - P0
      - P1
      - P2
    safety_boundary:
      candidate_only: true
      runtime_safety_truth: false
failure_policy:
  on_error: record_failure
  retry:
    max_attempts: 0
    backoff_seconds: 0
  degrade_to: scout.ai.route_context.assess.v0
control_surface:
  operator_visible: true
  manual_run_allowed: true
  disable_allowed: true
  status_label: Route context intelligence
audit:
  log_inputs: true
  log_outputs: true
  log_decision: true
  retention: mission_lifetime
