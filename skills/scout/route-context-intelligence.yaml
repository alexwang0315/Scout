id: route-context-intelligence
version: 0.1.5
status: experimental
type: analysis
priority: 54
triggers:
  - event: assistant.route_context_intelligence_requested
    description: Answer Route Context Intelligence questions from docs/specs/scout-route-context-intelligence-implementation.md about route story, professional itinerary coverage, historical/cultural/natural/terrain/seasonal layers, observation stops, source gaps, and briefing-ready route context.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.normalized.context.route_context
      - docs.specs.scout_route_context_intelligence_implementation
      - agents.skills.scout_route_context_briefing.source_catalog
  - event: assistant.route_context_briefing_html_requested
    description: Plan or draft a candidate-only route-context briefing response from workspace cache while preserving the Scout media quality gate and source-tier boundary.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.normalized.context.route_context.route_context_pack
      - pretrip.workspace.candidates.route_context_points
      - pretrip.workspace.normalized.context.route_context.source_manifest
  - event: assistant.route_context_briefing_variants_requested
    description: Generate exactly five complete route-content briefing variant specs in one Scout AI/Pydantic AI model call, then let the deterministic renderer place those model-provided specs and workspace evidence into HTML without Codex post-hoc supplement.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.normalized.context.route_context.route_context_pack
      - pretrip.workspace.candidates.route_context_points
      - pretrip.workspace.normalized.context.route_context.source_manifest
      - pretrip.workspace.normalized.context.route_context.media_manifest
      - pretrip.workspace.outputs.layers.normalized.web_case_evidence
      - pretrip.workspace.outputs.briefings.route_context_briefing.template_reference
  - event: assistant.route_context_research_gap_detected
    description: Identify missing P0/P1/P2 route-context evidence according to docs/specs/scout-route-context-intelligence-implementation.md and explain whether trusted native research, operator source review, or offline cache regeneration is needed.
    required_refs:
      - pretrip.workspace.project
      - docs.specs.scout_route_context_intelligence_implementation
activation_gate:
  mode: manual
  requires_human_approval: false
  conditions:
    - user asks why a route is worth walking, what historical/cultural/natural/terrain/seasonal context exists, which points are worth a short observation stop, or what a pretrip route briefing should include
    - follow docs/specs/scout-route-context-intelligence-implementation.md as the controlling Route Context Intelligence spec
    - mirror the Scout route-context briefing skill's P0/P1/P2 source catalog, product copy gate, media quality gate, and visual/map briefing template when forming answer plans
    - inspect workspace cache and deterministic Scout AI tools first, while keeping WebSearch and WebFetch available throughout the run for freshness checks and evidence gaps
    - preserve the spec's P0/P1/P2 source tier policy, provenance fields, source gaps, cache-first answer path, and offline regeneration boundary
    - use P0 sources for official/status/baseline facts, P1 sources for context expansion/community names/repeated point references, and P2 Scout-owned evidence for Scout-local completed-trip observations with path/hash/capture/privacy/review provenance
    - unreviewed P2 evidence can seed candidates or caveats only; reviewed P2 may support route notes, observation points, pace-fit context, and next-trip pretrip suggestions
    - for operator-triggered briefing generation with network access, use WebSearch for discovery and WebFetch for every selected source; search snippets alone are never evidence
    - native research must not be disabled by workspace_tools_enabled, legacy SCOUT_AI_OS_NATIVE_RESEARCH=0, a briefing runner, or a no-tools prompt
    - if workspace evidence is missing or stale, use trusted WebSearch/WebFetch to collect candidate source URLs, then hand them to the deterministic server-side collector for refetch, hash, normalization, and workspace caching
    - route-context HTML or presentation requests may use refreshed route_context_pack, route_context_points, source_manifest, media_manifest, bounded web_case_evidence, and route-specific media refs
    - route-context variant-generation requests must use a single Scout AI/Pydantic AI model call to produce exactly five complete variant specs; each spec must include its own title, subtitle, editorial thesis, section/chapter headings, observation prompts, point angles, chart titles, source storyline, leader review focus, and closing copy before rendering starts
    - deterministic rendering may arrange workspace evidence and model-provided copy into HTML, but it must not add new story copy, hidden rationale, route facts, section meaning, or product-visible explanation after the model response; failed or thin variants must be reported as failed rather than patched by Codex or the renderer
    - route-context variant artifacts must record the model name, provider-reported token usage when available, prompt content, response content, skill manifest hash, and model response hash in machine-readable Scout AI artifacts; keep those audit fields out of product-visible HTML
    - every generated variant must be compared against the selected baseline briefing for visible text richness, editorial innovation, chart/diagram ratio, blocked product-copy terms, and media quality before it is presented as a usable route briefing candidate
    - variant outputs must be visually distinct from each other and from prior dashboard/admin briefings; prior artifacts may define the minimum richness bar, but their copy and layout must not be copied
    - product-visible wording must describe the trip, itinerary, route segment, source, lodging/intermediate point, terrain, weather/season, observation stop, or leader review task; do not expose prompt/model/cache/artifact-boundary implementation wording
    - do not reuse previous route URLs, image choices, lodging points, or copy as route defaults; previous artifacts are structure examples only
    - reject website chrome, logos, SVG icons, tracking pixels, social widgets, and decorative placeholder images; missing visual slots become explicit visual evidence gaps
    - briefing-style answers should prefer visual agenda, photo essay, map atlas, source tier spine, six context layers, P2 Scout-owned layer, and leader review tasks over source-table or engineering-report prose
    - when a professional itinerary, route encyclopedia, tour page, or planning page is provided, first inventory its activity-planning sections and compare them against Scout coverage; missing route metrics, permits, lodging, segment schedule, resources, transport, equipment/readiness, contingencies, support vendors, or peer timing samples must become sourced candidate sections or explicit evidence gaps
    - official P0 sources should govern current route status, permits, lodging capacity, booking/application windows, closures, prices, and access constraints; P1 professional itinerary pages can enrich the briefing but must not override fresher P0 evidence
    - never invent vendor contacts, Line IDs, phone numbers, shuttle availability, prices, bed counts, booking rules, or public transport details; login-gated or redacted professional page data becomes a support-category review task
    - public completed-trip timing samples and pace coefficients can inform pace-fit review and route variability, but must not become user ranking, required pace, or runtime safety truth
    - output remains candidate-only and never grants on-route stopping, photographing, waiting, detouring, or go/no-go permission
    - distinguish worth observing from allowed to stop; any stopping, photographing, waiting, detouring, or route decision still needs Contextual Permissioning
    - no runtime safety mutation, outbound send, hardware control, or workspace write is allowed from this read-only skill
noise_control:
  cooldown_seconds: 0
  dedupe_window_seconds: 0
  max_runs_per_mission: null
  suppression_keys:
    - project_id
    - route_context_question_family
