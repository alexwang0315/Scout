    - route_context_summary
    - context_layers
    - observation_points
    - contextual_permission_boundary
    - source_tier_summary
    - source_refs
    - cache_status
    - missing_evidence
    - research_gap_next_step
    - p2_scout_owned_evidence_summary
    - p2_privacy_review_state
    - product_copy_gate
    - visual_evidence_gaps
    - professional_itinerary_coverage
    - route_baseline
    - permit_lodging_application
    - segment_itinerary
    - transport_access
    - resource_points
    - equipment_readiness
    - contingency_alternatives
    - support_vendor_categories
    - peer_timing_samples
    - offline_regeneration_boundary
    - briefing_variants
    - variant_comparison
    - one_model_call_complete
    - no_codex_posthoc_supplement
    - model_name
    - native_research_status
    - web_search_call_count
    - web_fetch_call_count
    - researched_source_refs
    - token_usage
    - prompt_content
    - response_content
    - candidate_only
    - runtime_safety_truth
  layout_contract:
    required_sections:
      - question_intent
      - visual_agenda
      - photo_essay
      - visual_kit
      - map_atlas
      - source_tier_spine
      - route_context_summary
      - historical_layer
      - cultural_layer
      - natural_layer
      - terrain_layer
      - seasonal_layer
      - observation_points
      - p2_scout_owned_layer
      - source_tier_summary
      - missing_evidence
      - professional_itinerary_coverage
      - route_baseline
      - permit_lodging_application
      - daily_itinerary_options
      - segment_time_distance_elevation
      - resource_points
      - transport_access
      - equipment_readiness
      - contingency_alternatives
      - support_vendor_categories
      - peer_timing_samples
      - leader_review_tasks
      - variant_comparison
      - token_usage_audit
      - contextual_permission_boundary
      - safety_boundary
    source_tiers_required:
      - P0
      - P1
      - P2
    visual_direction:
      palette: bold_expedition_route_context
      accents:
        - dark_ground
        - ember_red
        - signal_yellow
        - high_contrast_map_panel
      rule: Use a high-energy expedition briefing structure with route-specific photos, maps, source cards, and review tasks; never fall back to a pure source table or implementation report.
    media_quality_gate:
      must_prefer:
        - route-specific P0/P1 photos or maps bound to the route, lodging nodes, named points, context layers, or source sections
        - reviewed P2 Scout-owned photos, voice notes, stop-worthiness feedback, and route media from the same workspace
        - map or route-summary visuals that are explicitly tied to Scout route context evidence
        - full-route overview maps, lodging/intermediate nodes, terrain passage visuals, short observation point media, and weather/season imagery when provenance is clear
      must_reject:
        - website logos, logotypes, badges, avatars, and brand tiles
        - SVG icons and UI controls such as menu, search, close, language, share, audio, or browser chrome buttons
        - tracking pixels, social widgets, and unrelated campaign or education graphics
        - decorative placeholders used to fill missing briefing slots
        - product-visible prompt/model/compiler/cache/path/boundary wording, material-board labels, image-guide labels, and internal AI/design guidance
      missing_visual_policy: Report visual evidence gaps and route-specific shot-list or leader-review items instead of substituting generic graphics, site chrome, or explaining the page template.
      post_render_check: Route-context briefing output should have no selected hero/gallery images from logos, UI chrome, tracking media, or unrelated brand assets.
    variant_generation_gate:
      required_variant_count: 5
      model_call_policy: exactly_one_model_call_for_variant_specs
      renderer_policy: arrange_model_specs_and_workspace_evidence_without_posthoc_story_supplement
      minimum_copy_contract:
        - title
        - subtitle
        - editorial_thesis
        - chapter_titles
        - observation_prompts
        - point_angles
        - chart_titles
        - source_storyline
        - leader_review_focus
      comparison_required:
        - visible_text_richness_against_baseline
        - editorial_innovation
        - chart_or_diagram_ratio
        - blocked_product_copy_terms
        - media_quality_gate
      audit_required:
        - model_name
        - token_usage
        - prompt_content
        - response_content
        - skill_manifest_sha256
        - model_output_sha256
    safety_boundary:
      candidate_only: true
      runtime_safety_truth: false
    professional_itinerary_gate:
      detect_sources:
        - professional route encyclopedia page
        - commercial or community itinerary page
        - route planning page with schedule, logistics, or support resources
      compare_against:
        - route_context_pack
        - route_context_points
        - source_manifest
        - media_manifest
        - route_summary
        - p2_scout_owned_evidence_summary
        - rendered_route_context_briefing
      required_coverage:
        - headline route metrics and grade
        - route aliases, summit/objective metadata, and trailheads
        - permits, lodging, application windows, and official status freshness
        - itinerary variants and day-by-day schedule
        - segment distance, time, elevation, and route pressure
        - water, toilet, meal, lodging, and resource points
        - self-drive, public transport, shuttle, parking, and pre-night lodging
        - equipment, water carry, navigation level, and target hiker profile
        - caution list, route highlights, alternatives, and shortened plans
        - support vendor categories without fabricated private contacts
        - public peer timing samples as non-normative reference evidence
      output_rule: Report each coverage item as covered, partial, missing, conflicting, or stale, with source refs and next leader-review action.
failure_policy:
