    - scout_ai_route_context_research_gap
    - scout_ai_route_context_tool_output
    - scout_ai_route_context_briefing_variants
    - scout_ai_route_context_briefing_variants_plan
    - scout_ai_route_context_briefing_variant_comparison
  required_fields:
