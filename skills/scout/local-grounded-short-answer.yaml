id: local-grounded-short-answer
version: 0.11.0
status: experimental
type: summary
priority: 95
triggers:
  - event: assistant.ai_hat_raw_answer_requested
    description: Generate a model-authored field answer from facts-only Scout evidence without a precomposed answer or renderer.
    required_refs: []
activation_gate:
  mode: automatic
  requires_human_approval: false
  conditions:
    - AI HAT+2 raw model evaluation is explicitly enabled
noise_control:
  cooldown_seconds: 0
  dedupe_window_seconds: 0
  max_runs_per_mission: null
  suppression_keys: []
preflight:
  required_skill_ids: []
  required_capabilities: []
  required_artifacts: []
allowed_reads:
  - assistant.total_info_entry
  - assistant.workspace_compact_evidence
  - assistant.current_sensor_snapshot
  - assistant.tool_missing_evidence
allowed_writes: []
forbidden_writes:
  - phase1.runtime
  - phase1.safety
  - phase2.brain.observed_facts
  - live.safety_api
  - hardware.controls
  - outbound.messages
output_schema:
  format: artifact
  artifact_kinds:
    - scout_ai_local_model_raw_answer
  required_fields:
    - question
    - compact_evidence
    - model_answer
failure_policy:
  on_error: record_failure
  retry:
    max_attempts: 0
    backoff_seconds: 0
  degrade_to: null
control_surface:
  operator_visible: true
  manual_run_allowed: false
  disable_allowed: true
  status_label: Local grounded short answer
audit:
  log_inputs: true
  log_outputs: true
  log_decision: true
  retention: short_term
answer_contract:
  language: zh-Hant
  max_sentences: 3
  prompt_contract:
    mode: facts_only
    precomposed_answer_allowed: false
    deterministic_answer_template_allowed: false
    same_model_self_review_allowed: true
    self_review_must_not_receive_reference_answer: true
    self_review_may_receive_previous_model_answer: true
  evidence_checklist:
    - 第一句直接回答問題，不要先解釋任務或重複問題
    - 只使用 compact evidence 中出現的事實、缺口與候選，不加入一般常識
    - evidence 有 CP、GPX、距離、時間或 score 時，保留最相關的具體依據
    - 風險位置題若同時有 CP、距離、GPX、score 與 bucket，回答必須保留全部欄位，不可只留下 CP 名稱
    - self-review 保留上一版已正確的事實，只補缺漏並刪除 guard 指出的錯誤，不得每輪從零重寫
  missing_evidence_rules:
    - 標示 missing 的觀測一律是未知，不得改寫成目前已有、足夠、不足、安全或危險
    - 缺少必要觀測時要回答目前不能判定，並指出最多三項最關鍵缺口
    - 使用者詢問是否應做高山症等低風險自評時，直接建議現在進行自評並列出檢查項目；不得因缺資料拒絕自評，也不得把自評寫成診斷或繼續上升許可
  style_rules:
    - 最多三句繁體中文，不輸出 JSON、placeholder、分析過程或 prompt 用語；只有列出兩到四個待援可見性候選時可使用短清單
    - 每句必須完整結束，不得以「並、且、或、以及、建議」等未完成連接詞收尾
    - candidate、需複核與行前圖層不得寫成已確認事故、現場危險或安全指令；路線稱位置或路段，不稱部位；使用不能確認現場危險，不使用缺少受詞的危及
    - 不得把高 terrain score 解讀成較安全、較適合通行或較適合摸黑
  action_guidance: {}
  topic_guidance:
    - triggers:
        - 體能
        - 體力
        - 太硬
      guidance:
        - 心率、HRV、body battery、RPE 或配速標示 missing 時，直接回答目前不能判定路線是否太硬
        - 不得聲稱目前配速、體能或恢復狀態良好
    - triggers:
        - 配速
        - buffer
      guidance:
        - 配速、最近 CP 時間、下一 CP ETA 或最慢成員配速缺失時，回答目前不能判定時間緩衝
        - CP 提供的是通過時間，不可寫成 CP 速度
    - triggers:
        - 最容易出事
        - 下雨後
        - 停留拍照
      guidance:
        - 風險分數只能指出優先複核候選，不得回答該處一定會出事、雨後一定危險或必須禁止停留
        - 回答要保留最高候選的 CP、距離、GPX、score、bucket，以及 candidate 或人工複核邊界
    - triggers:
        - 摸黑
        - 低容錯
      guidance:
        - 所列高分地形都是優先複核候選，不得回答其中任何一處較適合夜間通行
        - 問題使用複數時，至少保留兩個不同 GPX 位置與各自 terrain score
        - 低容錯題第一句直接回答「有低容錯地形候選」，不得用問句重述使用者問題
    - triggers:
        - checkpoint
      guidance:
        - 不能說某處一定要新增 checkpoint；保留主要難點路段 ID 與是否增設所需條件
    - triggers:
        - 水和補給
        - 水量
        - 補給
      guidance:
        - 水量、剩餘時間、耗水率或補水點缺失時，回答不能計算，不得輸出建議公升數或 placeholder
    - triggers:
        - 晚出發
      guidance:
        - 不得把晚出發誤寫成提前出發；保留 CP Graph 難點、所需時間與缺失條件
        - 缺天氣、照明電量、水食物或隊伍狀態時，不得確認能安全完成
        - 不得把「CP 間進度尚未完整」當成既有事實；若 brief 有路段時間，回答必須保留該時間
    - triggers:
        - 高山症自評
      guidance:
        - 直接建議現在做自評，檢查海拔與上升速率、頭痛噁心暈眩疲倦、走路穩定與認知狀態、同伴觀察
        - 不得診斷高山症，也不得因自評而確認適合繼續上升
    - triggers:
        - 隊伍分離
        - 未抵達約定山屋
        - 定時回報
        - 通知留守人
      guidance:
        - 隊員位置、距離趨勢、最後共同點或通訊標示 missing 時，不得寫成目前已知；使用者明說有人未抵達時，不得反過來質疑是否未抵達
        - 是否逾時或是否升級通報必須核對原定時間、目前時間、最後成功回報、最後位置與約定升級條件，不得發明分鐘門檻
    - triggers:
        - 留守人
        - 報案
      guidance:
        - 報案資訊題要整理行程計畫、目前或最後位置與時間、傷勢與隊伍人數、訊號聯絡與電量、天氣、照明、保暖、水與食物
        - 未確認欄位標示未知，由留守人轉報；不得聲稱 Scout 已自動報案或發送 SOS
    - triggers:
        - 手機電量
        - 手錶沒電
        - 頭燈電量
        - 行動電源
        - 離線地圖
        - 第二套導航工具
      guidance:
        - 裝置狀態標示 missing 時，只能說目前不能確認是否足夠或可用，並列出電量、耗電率、載入狀態、備援裝置與剩餘時間；不得把未知寫成不可定位或已載入
        - 句子必須完整結束，不得輸出截斷詞、泛化適用性建議或重複的補充句
    - triggers:
        - 裝備濕掉
        - 裝備受潮
      guidance:
        - 缺少保暖照明受潮、衣物乾濕、雨風溫度、避雨點與下一安全點時，不得自行建議繼續或停止前進
    - triggers:
        - 不確定自己在哪
        - 原地等待
        - 下切溪谷
        - 稜線找訊號
      guidance:
        - lost-mode playbook 有停止前進、隊伍集合與不要分散找路或下切的 facts 時必須直接使用；不得在位置不確定時建議找路、下切或只為訊號盲目上稜
        - 稜線移動題必須先要求目前位置、route geometry、暴露地形與回退路徑，不得把通訊需求升級成移動許可
    - triggers:
        - 可視標記
        - 保存證據
        - 位置分享
      guidance:
        - 戶外可視標記是在安全處使用高對比材料、反光物或規律燈光並記錄位置時間，不是軟體介面標記
        - 搜救證據包含位置時間、最後方向與軌跡、隊伍傷勢、訊號電量、天氣資源；位置只人工分享給已約定留守人、領隊或救援窗口，Scout 不自動發送
    - triggers:
        - 手機只剩 5%
      guidance:
        - 保留使用者明示的 5% 電量，優先定位與必要通訊、先送一則短訊息、關閉非必要功能，並僅在定位傳送或約定回報時啟用必要無線功能
    - triggers:
        - 滑倒受傷
        - 座標還是地標
        - 留守人轉報
      guidance:
        - 使用者已說位置清楚時不得反向要求重新確認是否有位置；保留位置已知，並補實際座標或最後確認點、時間、傷勢、意識、能否行走、隊伍與通訊欄位
        - 求救位置同時提供座標與地標；座標附格式、基準、時間與精度，地標補充周圍特徵與接近方向
        - 未確認欄位標示未知，只準備人工轉報，不得聲稱 Scout、留守人或 119 已完成發送或報案
    - triggers:
        - 直升機吊掛
        - 搜救員接近
        - 更開闊
      guidance:
        - 吊掛、地面接近與開闊待援位置只能回答候選條件，需位置、坡度、障礙、完整移動或接近路徑、天候能見度、傷者與隊伍狀態，最終由救援單位判斷
        - 不得把 terrain score 或 major point 寫成已確認吊掛點、可接近位置或安全待援點，也不得為可見性盲目移動
    - triggers:
        - 移動傷者
        - 現場指揮
        - 撐過夜
      guidance:
        - 移動傷者可能造成二次傷害；除非原位置有立即危險，否則先避免移動並補傷勢、意識、呼吸出血、路徑地形、人力與專業救援建議
        - 多人事故可指定一名協調者，分配傷者照護、通訊轉報與事件紀錄，但不得讓隊伍分散或取代正式救援指揮
        - 待援過夜依序處理停止不必要移動與集合、避風與隔絕濕冷、乾燥保暖、水食物電量照明盤點、保留定位通訊、位置紀錄與可視標記、隊員互相檢查
    - triggers:
        - 最早的風險訊號
        - warning 應該更早
        - CP 設錯或漏設
        - GPX corridor
        - 停留風險被忽略
      guidance:
        - 行後時間題必須使用實際事件、warning 與決策時間線；不得把最高風險分數或候選 CP 當成最早已發生警訊
        - CP 與 corridor 回顧需比較計畫圖、實際軌跡與通過時間、GNSS 誤差、地圖精度、地形、可回退性與現場辨識度；證據不足時明確回答目前不能指定哪一段
        - 景觀停留風險需對照計畫停留、實際停留事件、附近地形風險與 route note；高風險候選不等於已證實被忽略
    - triggers:
        - incident package
        - field case
        - 哪些 spec
        - 下次行前規劃
      guidance:
        - incident package 整理位置時間、座標基準與精度、實際軌跡與 CP、傷勢隊伍、天氣資源通訊、警示決策時間線、來源 ref 與未知欄位；不得宣稱已自動送出
        - field case 必須具備可重建時間線、來源追溯、學習價值、隱私審查與人工核准；缺任一項時不得自動升格
        - spec 更新只能從可重現失敗追溯到現行 requirement、工具或 skill 契約與 regression test，再列為人工審查候選
        - 要求三項下次規劃時，依 evidence gap 整理三項明確工作，並說明不是已證實事故原因
  examples:
    - question: 降雨後哪個位置需要優先複核？
      facts:
        - 優先複核位置=CP 8
      missing_evidence:
        - 即時天氣資料
      boundary: 這是行前複核候選，不能確認現場已經危險
      action_token: REVIEW_CANDIDATE
      answer: 降雨後先複核 CP 8；目前缺少即時天氣資料，因此只能列為行前複核候選，不能確認現場已經危險。
    - question: 目前最高分的行前風險候選是哪個 CP？
      facts:
        - 最高分行前風險候選=CP 8
      missing_evidence: []
      boundary: 風險分數不能用來預測事故，仍需人工或現場複核
      action_token: REVIEW_CANDIDATE
      answer: CP 8 是目前最高分的行前風險候選；風險分數不能用來預測事故，仍需人工或現場複核。
    - question: 哪些路段一定要增設 checkpoint？
      facts:
        - candidate_segment=seg.5
        - candidate_reasons=需要日照、無撤退點、無補水點、路段時間長
        - existing_endpoint_cp_rule=兩端已有 CP 時不應重複設點
      missing_evidence: []
      boundary: 不能判定一定要增設；需看通過時間、geometry、可回退性與現場辨識度
      action_token: REVIEW_CANDIDATE
      answer: 目前不能判定一定要增設 checkpoint；先複核 seg.5，該段內無撤退點與補水點，但兩端已有 CP，是否增設中間點仍需看通過時間、geometry、可回退性與現場辨識度。
    - question: 哪些路段不適合摸黑走？
      facts:
        - GPX 12.3 km（teii_20m=88.8）
        - GPX 18.4 km（teii_20m=87.9）
      missing_evidence:
        - 即時天氣窗
      boundary: 兩處都是行前候選，不能確認任一處適合夜間通行
      action_token: REVIEW_CANDIDATE
      answer: 摸黑前先複核 GPX 12.3 km（teii_20m=88.8）與 GPX 18.4 km（teii_20m=87.9）；目前缺少即時天氣窗，不能確認任一處適合夜間通行。
    - question: 這條路線有沒有低容錯地形？
      facts:
        - GPX 12.3 km
        - teii_20m=88.2
      missing_evidence: []
      boundary: 這是低容錯地形的行前複核候選，尚未確認為現場危險
      action_token: REVIEW_CANDIDATE
      answer: 有低容錯地形候選：GPX 12.3 km 的 teii_20m=88.2；這只能作為行前複核依據，尚未確認為現場危險。
    - question: 哪裡要避免停留拍照？
      facts:
        - 最高分行前風險候選=CP 8
      missing_evidence: []
      boundary: CP 8 是避免長時間停留拍照的候選，仍需現場複核
      action_token: REVIEW_CANDIDATE
      answer: CP 8 是優先避免長時間停留拍照的候選；這不是即時禁令，仍需依現場狀況複核。
    - question: 我目前的體能足夠走完嗎？
      facts:
        - requested_inputs=目前速度、最近休息與個人負荷
        - RPE=自覺用力程度
      missing_evidence:
        - 當下配速
        - 疲勞觀測
        - body battery
      boundary: 目前不能判定體能是否足夠
      action_token: UNKNOWN
      answer: 目前缺少當下配速、body battery 與疲勞觀測，不能判定體能是否足夠；請提供最近休息時間與 RPE（自覺用力程度）。
    - question: 我今天的配速 buffer 足夠嗎？
      facts:
        - 需要資料=目前配速、最近 CP 通過時間、下一 CP ETA、最慢成員配速
      missing_evidence:
        - 目前配速
        - 最近 CP 通過時間
        - 下一 CP ETA
      boundary: 目前不能判定今日配速與時間緩衝是否足夠
      action_token: UNKNOWN
      answer: 目前缺少配速、最近 CP 通過時間與下一 CP ETA，不能判定今日時間緩衝是否足夠；請提供目前配速、最近 CP 通過時間、下一 CP ETA 與最慢成員配速。
    - question: 我需要準備多少水和補給？
      facts:
        - requested_inputs=現有水量、剩餘時間、體重、耗水率、氣溫與補水點
      missing_evidence:
        - 現有水量
        - 剩餘時間
        - 體重與耗水率
      boundary: 目前不能計算需要準備多少水和補給
      action_token: UNKNOWN
      answer: 目前缺少現有水量、剩餘時間、體重與耗水率，不能計算需要準備多少水和補給；請再提供氣溫與沿途補水點。
    - question: 晚出發後還能照原計畫走嗎？
      facts:
        - departure_delay_minutes=30
        - bottleneck_segment=seg.5
        - checkpoint_pair=CP 3 到 CP 4
        - segment_duration=45 分鐘
      missing_evidence:
        - 天氣
        - 頭燈電量
      boundary: 目前不能確認能照原計畫完成；需重算折返窗口
      action_token: REPLAN
      answer: 晚出發 30 分鐘後，目前不能確認仍能照原計畫完成；seg.5 的 CP 3 到 CP 4 約需 45 分鐘，且缺少天氣與頭燈電量，應先重算折返窗口。
    - question: 我該做高山症自評嗎？
      facts:
        - 目前海拔與上升速率待確認
        - 症狀與步態待確認
      missing_evidence:
        - 海拔與上升速率
        - 頭痛噁心暈眩疲倦
        - 走路穩定與認知狀態
      boundary: 自評不是診斷，也不能用來確認可繼續上升
      action_token: SELF_CHECK
      answer: 建議現在做高山症自評，檢查海拔與上升速率、頭痛噁心暈眩疲倦、走路穩定與認知狀態，並請同伴觀察；這不代表診斷，也不能確認可繼續上升。
