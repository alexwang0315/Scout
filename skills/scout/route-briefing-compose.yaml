id: route-briefing-compose
version: 0.1.1
status: experimental
type: analysis
priority: 48
triggers:
  - event: pretrip.route_briefing_requested
    description: Compose a candidate-only HTML route briefing from operator-reviewed route research.
    required_refs:
      - pretrip.workspace.route_research_pack
      - pretrip.workspace.route_summary
activation_gate:
  mode: operator_approved
  requires_human_approval: true
  conditions:
    - user or operator requests a route activity briefing
    - source URLs and route facts have been reviewed outside runtime
    - output is kept candidate-only and does not mutate runtime safety truth
noise_control:
  cooldown_seconds: 3600
  dedupe_window_seconds: 7200
  max_runs_per_mission: 4
  suppression_keys:
    - project_id
    - route_id
preflight:
  required_skill_ids: []
  required_capabilities:
    - pretrip.workspace.read
    - pretrip.workspace.write
  required_artifacts:
    - operator_reviewed_route_research_pack
allowed_reads:
  - pretrip.workspace.project
  - pretrip.workspace.route_summary
  - pretrip.workspace.route_research_pack
  - pretrip.workspace.normalized.context.route_context
  - pretrip.workspace.candidates.route_context
allowed_writes:
  - pretrip.workspace.outputs.briefings
  - pretrip.workspace.candidates.route_briefings
forbidden_writes:
  - phase1.runtime
  - phase1.safety
  - phase2.brain.observed_facts
  - live.safety_api
  - hardware.controls
output_schema:
  format: artifact
  node_types:
    - RouteBriefingCandidate
    - SkillRunRecord
  artifact_kinds:
    - pretrip_route_briefing_compose
    - html_briefing
  required_fields:
    - route_id
    - source_refs
    - context_layers
    - observation_stops
    - itinerary_options
    - visual_kit
    - map_atlas
    - source_tier_spine
    - route_baseline
    - permit_lodging_application
    - segment_itinerary
    - transport_access
    - resource_points
    - water_food_lodging
    - equipment_readiness
    - contingency_alternatives
    - support_vendor_categories
    - peer_timing_samples
  layout_contract:
    required_sections:
      - visual_agenda
      - photo_essay
      - visual_kit
      - map_atlas
      - source_tier_spine
      - historical_layer
      - cultural_layer
      - natural_layer
      - terrain_layer
      - seasonal_layer
      - observation_points
      - route_baseline
      - permit_lodging_application
      - daily_itinerary_options
      - segment_time_distance_elevation
      - resource_points
      - transport_access
      - water_food_lodging_services
      - equipment_readiness
      - contingency_alternatives
      - support_vendor_categories
      - peer_timing_samples
      - professional_itinerary_gap_review
    source_tiers_required:
      - P0
      - P1
      - P2
    visual_direction:
      palette: bold_expedition
      accents:
        - ember_red
        - signal_yellow
        - dark_ground
      rule: Use real route images/maps where available; render missing visual slots as evidence gaps.
    media_quality_gate:
      must_prefer:
        - route-specific P0/P1 photos or maps
        - reviewed P2 Scout-owned route media
        - images bound to route points, route segments, lodging nodes, context layers, or source sections
      must_reject:
        - website logos, logotypes, badges, avatars, and brand tiles
        - SVG icons and UI controls such as menu, search, close, language, share, or audio buttons
        - tracking pixels, social widgets, and unrelated campaign or education graphics
        - decorative placeholders used to fill missing briefing slots
      missing_visual_policy: Render an explicit visual evidence gap and shot list instead of substituting generic graphics.
      post_render_check: Generated briefing HTML should have zero selected hero/gallery images from site chrome, tracking media, or unrelated brand assets.
    safety_boundary:
      candidate_only: true
      runtime_safety_truth: false
    professional_itinerary_gate:
      required_when_source_present: true
      section_inventory:
        - headline route metrics and route grade
        - summit/objective aliases and metadata
        - trailhead and access points
        - permit, lodging, and application windows
        - 2D/3D or other daily itinerary options
        - segment distance, time, elevation, and pressure
        - water, toilet, meal, lodging, and resource points
        - self-drive, public transport, shuttle, parking, and pre-night lodging
        - equipment, water carry, navigation, and readiness profile
        - cautions, closures, weather-shortened plans, and alternative routes
        - support vendor categories without invented contact details
        - public peer timing samples as reference evidence only
      provenance_rule: Every section must carry P0/P1/P2 source refs or an explicit evidence gap.
      conflict_rule: Fresher P0 official status, permit, lodging, and closure evidence overrides P1 itinerary pages; contradictions become leader review tasks.
      forbidden_inference:
        - invented prices, bed counts, permits, vendor names, Line IDs, phone numbers, shuttle availability, booking windows, or open/closed status
        - converting peer timing samples into required pace or safety decisions
        - treating itinerary guidance as Contextual Permissioning approval
failure_policy:
  on_error: record_failure
  retry:
    max_attempts: 0
    backoff_seconds: 0
  degrade_to: manual_route_context_review
control_surface:
  operator_visible: true
  manual_run_allowed: true
  disable_allowed: true
  status_label: Route briefing compose
audit:
  log_inputs: true
  log_outputs: true
  log_decision: true
  retention: mission_lifetime
