id: gee-environment-assess
version: 0.1.0
status: experimental
type: analysis
priority: 45
triggers:
  - event: assistant.gee_environment_requested
    description: Answer questions about prepared GEE SMAP L4 soil moisture, GPM IMERG antecedent rain, hydrologic background, grids, timelines, and provenance evidence.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.outputs.environment.gee
activation_gate:
  mode: manual
  requires_human_approval: false
  conditions:
    - user asks about GEE, SMAP, soil moisture, root-zone wetness, GPM, IMERG, antecedent rain, hydrologic background, or GEE provenance
    - answer reads only prepared workspace artifacts generated by explicit pretrip preparation
    - output remains candidate-only and does not mutate runtime safety truth
noise_control:
  cooldown_seconds: 0
  dedupe_window_seconds: 0
  max_runs_per_mission: null
  suppression_keys:
    - project_id
    - gee_dataset_family
preflight:
  required_skill_ids: []
  required_capabilities:
    - scout.ai.gee_environment.assess.v0
  required_artifacts:
    - pretrip.workspace.project
    - pretrip.workspace.outputs.environment.gee
allowed_reads:
  - pretrip.workspace.project
  - pretrip.workspace.outputs.environment.gee.smap_l4_timeseries
  - pretrip.workspace.outputs.environment.gee.smap_l4_corridor_summary
  - pretrip.workspace.outputs.environment.gee.soil_moisture_grid
  - pretrip.workspace.outputs.environment.gee.gpm_imerg_raw_summary
  - pretrip.workspace.outputs.environment.gee.gpm_imerg_timeseries
  - pretrip.workspace.outputs.environment.gee.gpm_imerg_corridor_summary
  - pretrip.workspace.outputs.environment.gee.antecedent_rain_grid
  - pretrip.workspace.outputs.environment.environment_factor_matrix
  - pretrip.workspace.outputs.environment.go_no_go_review_draft
allowed_writes: []
forbidden_writes:
  - phase1.runtime
  - phase1.safety
  - phase2.brain.observed_facts
  - live.safety_api
  - hardware.controls
  - transport.egress
  - pretrip.workspace
output_schema:
  format: artifact
  node_types:
    - GeeEnvironmentEvidenceAnswer
    - SkillRunRecord
  artifact_kinds:
    - scout_ai_gee_environment_tool_output
    - gee_environment_workspace_answer
  required_fields:
    - answerability
    - gee_summary
    - provenance_summary
    - source_refs
    - missing_fields
    - candidate_only
    - runtime_safety_truth
failure_policy:
  on_error: record_failure
  retry:
    max_attempts: 0
    backoff_seconds: 0
  degrade_to: scout.ai.review_gap.assess.v0
control_surface:
  operator_visible: true
  manual_run_allowed: true
  disable_allowed: true
  status_label: GEE environment assess
audit:
  log_inputs: true
  log_outputs: true
  log_decision: true
  retention: mission_lifetime
