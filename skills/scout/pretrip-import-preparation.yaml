id: pretrip-import-preparation
version: 0.1.0
status: experimental
type: artifact
priority: 62
triggers:
  - event: assistant.pretrip_import_preparation_requested
    description: Let Scout AI collect missing operator inputs, then run GPX import and pretrip map/layer preparation through deterministic tools.
    required_refs: []
activation_gate:
  mode: operator_approved
  requires_human_approval: true
  conditions:
    - Scout AI may ask the user for missing raw-data inputs before any write occurs
    - required inputs include project_id, workspace_root, golden_route_gpx, and source_gpx_root or reference_gpx_paths
    - material_root is required when the run must include material_manifest, MCP named-point evidence, OCR/raster-label sources, or reference-equivalence replay
    - optional inputs include durable_evidence_source_root, raster_tile_cache_root, admin_base_url, reference_workspace_roots, and authorized_by
    - CWA/GEE environment artifacts are no-cache current-run evidence; durable_evidence_source_root must not replay weather, QPF, SMAP, GPM, or derived environment values
    - CWA source evidence and CWA-derived model/review outputs must expose hour-precision API request, fetch, valid-from, valid-until or observation timing metadata; failed or credential-blocked fetches record the attempt hour without synthetic fetch/validity hours
    - if any required input is missing, output a clarification artifact and do not call workspace-write tools
    - after inputs are complete, require explicit operator approval before calling import or preparation tools
    - all outputs remain candidate-only pretrip evidence and must not mutate runtime safety truth
noise_control:
  cooldown_seconds: 0
  dedupe_window_seconds: 0
  max_runs_per_mission: 10
  suppression_keys:
    - project_id
    - workspace_root
preflight:
  required_skill_ids: []
  required_capabilities:
    - pydantic_ai.v2.input_clarification
    - scout.pretrip.import_gpx
    - scout.pretrip.prepare_layers
    - scout.pretrip.route_context_collect
    - scout.checks.pretrip_release
    - tools.verify_scout_layer_contract
    - tools.verify_pretrip_workspace_spec_alignment
  required_artifacts: []
allowed_reads:
  - local.raw_gpx
  - local.gpx.reference_dir
  - local.gpx.golden_route
  - local.materials.pretrip
  - local.materials.material_manifest
  - pretrip.workspace.project
  - pretrip.workspace.normalized
  - pretrip.workspace.candidates
  - pretrip.workspace.outputs
  - pretrip.workspace.layer_manifest
  - pretrip.workspace.reference_comparison
  - scout.layer_contract
  - scout.pretrip.full_preparation_runbook
allowed_writes:
  - pretrip.workspace.project
  - pretrip.workspace.normalized
  - pretrip.workspace.candidates
  - pretrip.workspace.outputs
  - pretrip.workspace.layer_manifest
  - pretrip.workspace.layer_projection
  - pretrip.workspace.debug_projection
  - pretrip.workspace.rebuild_logs
  - pretrip.workspace.validation_reports
forbidden_writes:
  - local.raw_gpx
  - local.materials.source_data
  - phase1.runtime
  - phase1.safety
  - phase2.brain.observed_facts
  - live.safety_api
  - hardware.controls
  - transport.egress
output_schema:
  format: artifact
  node_types:
    - PretripInputClarificationRequest
    - PretripImportPreparationPlan
    - PretripImportPreparationRunResult
    - SkillRunRecord
  artifact_kinds:
    - pretrip_input_clarification_request
    - pretrip_import_preparation_plan
    - pretrip_import_preparation_run_result
  required_fields:
    - project_id
    - workspace_root
    - golden_route_gpx
    - source_gpx_root
    - material_root
    - missing_inputs
    - operator_approval_required
    - planned_tools
    - validation_gates
    - run_attempt_count
    - candidate_only
    - runtime_safety_truth
failure_policy:
  on_error: record_failure
  retry:
    max_attempts: 0
    backoff_seconds: 0
  degrade_to: manual_pretrip_import_preparation_runbook
control_surface:
  operator_visible: true
  manual_run_allowed: true
  disable_allowed: true
  status_label: Pretrip import preparation
audit:
  log_inputs: true
  log_outputs: true
  log_decision: true
  retention: mission_lifetime
