id: cwa-environment-assess
version: 0.1.0
status: experimental
type: analysis
priority: 46
triggers:
  - event: assistant.cwa_environment_requested
    description: Answer questions about prepared CWA warnings, observations, QPF, forecast, daylight/moonlight, tide/marine, and provenance evidence.
    required_refs:
      - pretrip.workspace.project
      - pretrip.workspace.outputs.environment.cwa
activation_gate:
  mode: manual
  requires_human_approval: false
  conditions:
    - user asks about CWA, official weather warnings, observations, QPF, township forecast, daylight/moonlight, tide, marine, or CWA provenance
    - answer reads only prepared workspace artifacts generated by server-side pretrip preparation
    - output remains candidate-only and does not mutate runtime safety truth
noise_control:
  cooldown_seconds: 0
  dedupe_window_seconds: 0
  max_runs_per_mission: null
  suppression_keys:
    - project_id
    - cwa_dataset_family
preflight:
  required_skill_ids: []
  required_capabilities:
    - scout.ai.cwa_environment.assess.v0
    - scout.ai.weather_window.assess.v0
  required_artifacts:
    - pretrip.workspace.project
    - pretrip.workspace.outputs.environment.cwa
allowed_reads:
  - pretrip.workspace.project
  - pretrip.workspace.outputs.environment.cwa.cwa_weather_evidence
  - pretrip.workspace.outputs.environment.cwa.warnings
  - pretrip.workspace.outputs.environment.cwa.observations
  - pretrip.workspace.outputs.environment.cwa.qpf_grid
  - pretrip.workspace.outputs.environment.cwa.qpf_route_timeline
  - pretrip.workspace.outputs.environment.cwa.qpf_corridor_summary
  - pretrip.workspace.outputs.environment.cwa.forecast_timeline
  - pretrip.workspace.outputs.environment.cwa.astronomy_timeline
  - pretrip.workspace.outputs.environment.cwa.tide_marine_timeline
  - pretrip.workspace.outputs.environment.environment_factor_matrix
  - pretrip.workspace.outputs.environment.go_no_go_review_draft
allowed_writes: []
forbidden_writes:
  - phase1.runtime
  - phase1.safety
  - phase2.brain.observed_facts
  - live.safety_api
  - hardware.controls
  - transport.egress
  - pretrip.workspace
output_schema:
  format: artifact
  node_types:
    - CwaEnvironmentEvidenceAnswer
    - SkillRunRecord
  artifact_kinds:
    - scout_ai_cwa_environment_tool_output
    - cwa_environment_workspace_answer
  required_fields:
    - answerability
    - cwa_summary
    - provenance_summary
    - source_refs
    - missing_fields
    - candidate_only
    - runtime_safety_truth
failure_policy:
  on_error: record_failure
  retry:
    max_attempts: 0
    backoff_seconds: 0
  degrade_to: scout.ai.weather_window.assess.v0
control_surface:
  operator_visible: true
  manual_run_allowed: true
  disable_allowed: true
  status_label: CWA environment assess
audit:
  log_inputs: true
  log_outputs: true
  log_decision: true
  retention: mission_lifetime
