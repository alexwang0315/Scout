schema: scout.dashboardCapabilityManifest.v1
version: 2
baseline_policy: maplibre_pre_migration_regression_guard_only
surfaces:
  - id: system-diagnostic
    route: /admin/dashboard#diagnostic
    capabilities:
      - id: dashboard.shell.runtime_route_navigation
        criticality: P0
        status: operational
        qualification_state: paused
        owner: dashboard
        expected_behavior:
          - Every rendered Dashboard navigation route can be opened through browser interaction on the selected real runtime project.
        forbidden_behavior:
          - A hidden route failure, uncaught page error, or unavailable runtime must not be reported as successful navigation.
        required_tests: [desktop_all_routes_real_runtime]
        required_evidence: [ui, network, trace, browser_action_log]
        authority_boundary: {source: browser, runtime_authority: false}
      - id: dashboard.diagnostic.controls
        criticality: P1
        status: operational
        qualification_state: outside_boundary
        owner: dashboard
        expected_behavior:
          - Diagnostic appears immediately after Settings.
          - Diag all and every individual Retest control expose running, passed, warning, and failed states.
          - A typed expected zero Evidence state renders a yellow warning while an unexplained zero remains failed.
          - startup_connection_status=not_checked renders yellow while workflow readiness remains a separate fact; red is reserved for an explicit bounded connection-probe failure.
        forbidden_behavior:
          - One failed case must not suppress the terminal result of another case.
        required_tests: [desktop_controls, mobile_no_overflow, isolated_case_continuation, typed_zero_warning, assistant_not_checked_warning]
        required_evidence: [ui, trace, video]
        authority_boundary: {source: browser, runtime_authority: false}
      - id: dashboard.diagnostic.read_only
        criticality: P0
        status: operational
        qualification_state: outside_boundary
        owner: dashboard
        expected_behavior:
          - Opening Dashboard and running Diag all leaves the sealed workspace byte-identical.
          - Diagnostic performs no POST, preparation, generation, outbound, or hardware action.
        forbidden_behavior:
          - A GET or Diagnostic check must not create artifacts, locks, or project metadata.
        required_tests: [dashboard_open_no_write, diag_all_no_write, zero_post_requests]
        required_evidence: [ui, network, server_state, trace]
        authority_boundary: {source: server, runtime_authority: false}
  - id: all-dashboard-live-browser
    route: /admin/dashboard#*
    capabilities:
      - id: dashboard.browser.maplibre_pre_migration_regression_guard
        criticality: P0
        status: operational
        qualification_state: active
        owner: qualification
        expected_behavior:
          - The real Dashboard loads and the configured major routes open through browser interaction on desktop and large-mobile viewports.
          - The current map fallback exposes a usable renderer surface without requiring an SVG DOM, iframe implementation, or MapLibre canvas implementation.
          - Canonical layer IDs remain present and one representative read-only layer control can change state and be restored without a fatal browser error.
          - Timeline and map-rail evidence retain the same non-empty evidence and artifact identity through selection and route transition.
          - The checked routes have no fatal console or page error, no top-level horizontal overflow, and no new operational or safety authority.
        forbidden_behavior:
          - The regression guard must not require future map behavior to expose legacy SVG paths, groups, transforms, or iframe-only selectors.
          - A candidate evidence selection, read-only layer operation, or browser label must not become runtime safety truth or authorize an operational action.
          - Passing this guard must not be reported as Dashboard productization, complete map qualification, or Terrain Intelligence qualification.
        required_tests: [maplibre_pre_migration_guard_desktop, maplibre_pre_migration_guard_large_mobile]
        required_evidence: [ui, network, browser_action_log, screenshots, trace, layer_id, artifact_id]
        authority_boundary: {source: browser, runtime_authority: false}
      - id: dashboard.browser.complete_control_coverage
        criticality: P0
        status: operational
        qualification_state: paused
        owner: qualification
        expected_behavior:
          - Every visible interactive control in the main document and rendered embedded frames on every Dashboard route is discovered at runtime and ends as browser-operated or delegated to a passing browser-operated specialist case.
          - Each ordinary state-changing operation has before/after screenshots plus an observable semantic and pixel change.
        forbidden_behavior:
          - Contract-test success, DOM presence, API 200, or a screenshot without browser operation must not count as functional coverage.
          - An unmapped, unexercised, missing-after-discovery, no-state-change, no-visual-change, or unauthorized-effect control must not be reported as PASS.
          - A disabled-only control or single-value selector must not be treated as proof that its function works.
        required_tests: [live_runtime_control_census, browser_before_after_state_change, zero_unmapped_controls]
        required_evidence: [ui, browser_action_log, control_inventory, screenshots, trace, video]
        authority_boundary: {source: browser, runtime_authority: false}
      - id: dashboard.visual.complete_live_rendering
        criticality: P0
        status: operational
        qualification_state: paused
        owner: qualification
        expected_behavior:
          - Every contracted Dashboard route is rendered and browser-scrolled on desktop and large-mobile profiles with screenshot evidence.
          - Visible content and controls are sharp, readable, unoccluded, unclipped, non-overlapping, non-broken, and free of unintended horizontal overflow.
        forbidden_behavior:
          - CSS blur, broken or upscaled raster content, clipped text, covered controls, overlapping controls, blank rendering, or unreviewed visual states must not be accepted.
        required_tests: [all_routes_desktop_visual, all_routes_mobile_visual, pixel_sharpness, dom_occlusion_and_clipping]
        required_evidence: [ui, visual_audit, screenshots, trace, video]
        authority_boundary: {source: browser, runtime_authority: false}
      - id: dashboard.maps.all_surface_interactions
        criticality: P0
        status: operational
        qualification_state: paused
        owner: maps
        expected_behavior:
          - All nine Dashboard map surfaces support Fit, zoom in, zoom out, mouse pan, keyboard pan, and persistent rectangle zoom through browser input.
          - Embedded maps operate all four visible directional pan buttons and prove the requested direction changed the map view.
          - Every native map exposes a visible Evidence hover hint and renders vector content plus tiles or an approved single image under the canonical render policy.
        forbidden_behavior:
          - A control click without a changed map view, a stretched stale tile matrix, missing content, hidden hint, blurred render, or failed raster request must not pass.
        required_tests: [all_nine_maps_real_browser_gestures, evidence_hover_hints, map_render_and_pixel_quality]
        required_evidence: [ui, network, map_interactions, screenshots, trace, video]
        authority_boundary: {source: browser, runtime_authority: false}
      - id: dashboard.layers.all_visible_toggle_integrity
        criticality: P0
        status: operational
        qualification_state: paused
        owner: maps
        expected_behavior:
          - Every pre-trip layer exposed by scout_layer_contract.py and every Weather layer control is toggled through the browser and produces a visible, correctly labelled state change.
          - Every visible layer preset and CWA product, window, timeline, opacity, and playback control is browser-operated against prepared live data and visibly changes the map.
          - An enabled layer has a visible non-empty render group containing its tile, vector, point, line, polygon, or approved image content.
        forbidden_behavior:
          - A checkbox-only change, empty enabled group, missing expected layer, mismatched ON or OFF label, failed raster response, or visually unchanged map must not pass.
        required_tests: [canonical_layer_toggle_census, weather_layer_toggle_census, enabled_layer_render_integrity]
        required_evidence: [ui, network, layer_interactions, screenshots, trace, video]
        authority_boundary: {source: browser, runtime_authority: false}
      - id: dashboard.layers.weather_hydrology_required_na
        criticality: P1
        status: operational
        qualification_state: outside_boundary
        owner: maps
        expected_behavior:
          - Main Map visibly lists soil-moisture, antecedent-rain, cwa-qpf, cwa-weather, and weather-api as required weather or hydrology layers.
          - A layer with prepared render content is operable and labelled AVAILABLE; a layer without prepared render content remains visible, is guarded from empty activation, and is labelled NA.
          - Six Axis Weather retains the detailed product, time-window, opacity, playback, and refresh controls for those canonical layers.
        forbidden_behavior:
          - A required weather or hydrology layer must not be hidden, omitted, reported as available without render content, or rendered as an enabled empty group.
          - NA must not fabricate evidence, start preparation, stop the Weather refresh job, or change runtime safety truth.
        required_tests: [main_map_required_weather_layer_visibility, unavailable_layer_na_guard, available_layer_render_integrity]
        required_evidence: [ui, layer_interactions, screenshots, trace]
        authority_boundary: {source: browser, runtime_authority: false}
  - id: outdoor-navigation
    route: /admin/dashboard#outdoor-navigation
    capabilities:
      - id: dashboard.navigation.partial_data_shell
        criticality: P0
        status: operational
        qualification_state: outside_boundary
        owner: navigation
        expected_behavior:
          - Preparing, unavailable, stale, and not-prepared states preserve the canonical map and control shell.
          - Empty states truthfully disclose that no terrain vectors or tiles are claimed.
        forbidden_behavior:
          - Reading a missing projection must not start preparation or imply ready terrain evidence.
        required_tests: [missing_projection_get, partial_map_shell, explicit_preparation_only]
        required_evidence: [ui, network, server_state]
        authority_boundary: {source: server, runtime_authority: false}
      - id: dashboard.maps.dynamic_rudy_tiles
        criticality: P0
        status: operational
        qualification_state: paused
        owner: maps
        expected_behavior:
          - Navigation, Architecture, and Weather advance active Rudy tile matrices after zoom.
          - UI zoom, active DOM matrix, and successful native tile requests agree.
        forbidden_behavior:
          - A stretched retained matrix or failed target request must not be reported as successful native zoom.
        required_tests: [navigation_dynamic_tiles, architecture_dynamic_tiles, weather_dynamic_tiles]
        required_evidence: [ui, network, trace, video]
        authority_boundary: {source: browser, runtime_authority: false}
  - id: outdoor-weather
    route: /admin/dashboard#outdoor-weather
    capabilities:
      - id: dashboard.weather.optional_rainfall_overlay
        criticality: P1
        status: operational
        qualification_state: outside_boundary
        owner: weather
        expected_behavior:
          - An absent optional rainfall projection returns a typed read-only 200 not_prepared response.
          - The Weather map client preserves the empty reason and renders zero rainfall grid cells.
        forbidden_behavior:
          - A cache-only GET must not start preparation, return an untyped 404, or fabricate rainfall cells.
        required_tests: [optional_overlay_absent_api, optional_overlay_empty_ui]
        required_evidence: [ui, network, server_state, trace]
        authority_boundary: {source: server, runtime_authority: false}
  - id: outdoor-route-context
    route: /admin/dashboard#outdoor-route-context
    capabilities:
      - id: dashboard.route_context.regeneration_api
        criticality: P2
        status: not_implemented
        owner: route-context
        expected_behavior:
          - Route Context regeneration remains explicitly deferred while the canonical briefing is available as a read-only surface.
        forbidden_behavior:
          - A missing regeneration API must not be reported as an operational capability, a passing qualification result, or permission to generate new workspace artifacts.
        required_tests: [expected_not_implemented_boundary]
        required_evidence: [ui, network]
        authority_boundary: {source: server, runtime_authority: false}
  - id: debug-hardware-readiness
    route: /admin/dashboard#debug
    capabilities:
      - id: dashboard.debug.hardware_readiness
        criticality: P2
        status: not_implemented
        owner: debug
        expected_behavior:
          - Hardware-readiness metadata remains explicitly deferred and excluded from operational qualification until its API and presentation are implemented.
        forbidden_behavior:
          - A missing hardware-readiness API must not be reported as an operational capability, a passing qualification result, or permission for a hardware effect.
        required_tests: [expected_not_implemented_boundary]
        required_evidence: [ui, network]
        authority_boundary: {source: server, runtime_authority: false}
  - id: contextual-permission
    route: /admin/dashboard#outdoor-permission
    capabilities:
      - id: dashboard.permission.fail_closed
        criticality: P0
        status: operational
        qualification_state: outside_boundary
        owner: permission
        expected_behavior:
          - Missing, stale, or incompatible projections render a blocked state with an actionable explanation.
          - Ready and degraded real runtime states remain visibly candidate-only.
          - When a degraded, blocked, or stale runtime state has no actionable refresh, the workbench and qualification evidence report Permission Refresh as TYPED_UNAVAILABLE with a reason instead of waiting for or presenting an ineffective retry.
        forbidden_behavior:
          - Permission presentation must not authorize departure, retreat, bivy, Safety, Emergency, outbound, or hardware effects.
          - A missing ineffective Refresh control in a typed degraded state must not be converted into a timeout or an operational-failure claim.
        required_tests: [ready_candidate_boundary, blocked_missing_seed, stale_baseline]
        required_evidence: [ui, network, server_state, trace]
        authority_boundary: {source: server, runtime_authority: false}
  - id: qualification-infrastructure
    route: internal://dashboard-qualification
    capabilities:
      - id: qualification.evidence.integrity
        criticality: P0
        status: operational
        qualification_state: active
        owner: qualification
        expected_behavior:
          - Every evidence file is SHA-256 indexed and independently verifiable.
          - A changed or missing indexed file fails verification.
          - Qualification uses one host-level operator lease shared across repository worktrees and may reclaim a lease only when its recorded process is no longer alive.
        forbidden_behavior:
          - Narrative claims must not override machine evidence or hash mismatches.
          - Two worktrees on the same host user must not collect or seal official qualification evidence concurrently.
        required_tests: [manifest_schema, evidence_tamper, intentional_p0_regression]
        required_evidence: [manifest, server_state]
        authority_boundary: {source: none, runtime_authority: false}
      - id: qualification.fixture.active_p0_matrix
        criticality: P0
        status: sandbox
        qualification_state: outside_boundary
        owner: qualification
        expected_behavior:
          - Synthetic fixtures may cover ready, degraded, blocked, stale, partial, zero-evidence, and Assistant enabled/disabled states for harness development only.
        forbidden_behavior:
          - Private workspaces or fixture evidence must not be represented as runtime truth, official qualification evidence, confirmed issue evidence, or a trusted baseline.
        required_tests: [fixture_matrix_schema, candidate_boundary, no_write_fixture]
        required_evidence: [manifest, server_state]
        authority_boundary: {source: none, runtime_authority: false}
      - id: qualification.deterministic_regression_baseline
        criticality: P1
        status: operational
        qualification_state: active
        owner: qualification
        expected_behavior:
          - Focused Dashboard remediation tests and the configured repository regression baseline pass without skipped failures.
        forbidden_behavior:
          - Browser success must not hide a failing deterministic contract test.
        required_tests: [dashboard_focused_pytest, repository_package_pytest]
        required_evidence: [junit, server_state]
        authority_boundary: {source: none, runtime_authority: false}
