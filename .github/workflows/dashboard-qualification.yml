name: Scout Dashboard Qualification

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCOUT_QUALIFICATION_OUTPUT: artifacts/qualification/ci/${{ github.sha }}

jobs:
  deterministic-qualification:
    name: Scout Deterministic Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m venv venv
      - run: ./venv/bin/pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: qualification
        continue-on-error: true
        env:
          SCOUT_QUALIFICATION_RUNTIME_URL: ${{ vars.SCOUT_QUALIFICATION_RUNTIME_URL }}
          SCOUT_QUALIFICATION_PROJECT_ID: ${{ vars.SCOUT_QUALIFICATION_PROJECT_ID }}
        run: npm run qualification:check:full
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-dashboard-qualification-${{ github.sha }}
          path: ${{ env.SCOUT_QUALIFICATION_OUTPUT }}
          retention-days: 90
      - if: always()
        run: >-
          ./venv/bin/python -m scripts.qualification.evaluate_qualification
          --manifest qualification/dashboard-capability-manifest.yaml
          --results "${SCOUT_QUALIFICATION_OUTPUT}/results.json"
          --policy qualification/policies/qualification-gates.yaml

  independent-review:
    name: Scout Independent Evidence Review
    needs: deterministic-qualification
    if: >-
      ${{ always() && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv venv
      - run: ./venv/bin/pip install -e . -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: scout-dashboard-qualification-${{ github.sha }}
          path: ${{ env.SCOUT_QUALIFICATION_OUTPUT }}
      - run: >-
          ./venv/bin/python -m scripts.qualification.verify_evidence
          "${SCOUT_QUALIFICATION_OUTPUT}"
      - id: reviewer
        continue-on-error: true
        run: |
          echo "Official review requires gpt-pro-collaboration in the Codex in-app browser."
          echo "Attach the hash-bound reviewer-verdict.json and gpt-pro-review-reference.json before enforcement."
          test -f "${SCOUT_QUALIFICATION_OUTPUT}/reviewer-verdict.json"
          test -f "${SCOUT_QUALIFICATION_OUTPUT}/gpt-pro-review-reference.json"
      - if: steps.reviewer.outcome == 'success'
        run: >-
          ./venv/bin/python -m scripts.qualification.enforce_review
          "${SCOUT_QUALIFICATION_OUTPUT}"
      - if: always()
        run: >-
          ./venv/bin/python -m scripts.qualification.verify_evidence
          "${SCOUT_QUALIFICATION_OUTPUT}" --build-packet
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-dashboard-reviewed-${{ github.sha }}
          path: ${{ env.SCOUT_QUALIFICATION_OUTPUT }}
          retention-days: 90
      - if: always()
        run: test "${{ steps.reviewer.outcome }}" = "success"
