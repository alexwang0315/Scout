[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-ai-os"
version = "0.1.0"
description = "Scout AI OS MVP scaffold for permissioned workflow automation."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "pydantic-ai-slim[openai,openrouter]==2.9.0",
    "pydantic-evals==2.9.0",
    "pyyaml",
    "uvicorn",
]

[project.scripts]
scout-ai-os-pydantic-smoke = "scout.cli.pydantic_smoke:main"
scout-ai-os-evals = "scout.evals.regression:main"
scout-ai-os-hardware-evidence = "scout.cli.hardware_evidence:main"
scout-ai-os-hardware-smoke = "scout.cli.hardware_smoke:main"
scout-ai-os-mac-chat = "scout.cli.mac_chat:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scout.evals" = ["*.json"]
"scout.mac_chat" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
