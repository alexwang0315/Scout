[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-ai-os"
version = "0.1.0"
description = "Scout AI OS MVP scaffold for permissioned workflow automation."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "pydantic-ai-slim[duckduckgo,openai,openrouter]==2.43.0",
    "pydantic-evals==2.43.0",
    "pyyaml",
    "uvicorn",
]

[project.optional-dependencies]
ai-hat-eval = [
    "smbus2==0.5.0",
]
pydantic-ai-smoke = [
    "pydantic-ai-slim[duckduckgo,mcp,web-fetch]==2.43.0",
]
nextgen-intelligence = [
    "httpx>=0.28,<1",
    "praisonaiagents==1.7.6",
]
pretrip-osm = [
    "osmium==4.3.1",
]
pretrip-workstation = [
    "numpy==2.5.0",
    "osmium==4.3.1",
    "pillow==12.2.0",
    "pytesseract==0.3.13",
]

[project.scripts]
scout-ai-os-pydantic-smoke = "scout.cli.pydantic_smoke:main"
scout-ai-os-pydantic-compat-smoke = "scout.cli.pydantic_compat_smoke:main"
scout-ai-os-evals = "scout.evals.regression:main"
scout-ai-os-hardware-evidence = "scout.cli.hardware_evidence:main"
scout-ai-os-hardware-smoke = "scout.cli.hardware_smoke:main"
scout-ai-os-mac-chat = "scout.cli.mac_chat:main"
scout-ai-os-intelligence-mcp = "scout.nextgen.intelligence_mcp_server:main"
scout-ai-os-intelligence-mcp-http = "scout.nextgen.intelligence_mcp_http_server:main"
scout-ai-os-dev-server = "scout.cli.dev_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scout.evals" = ["*.json"]
"scout.mac_chat" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
